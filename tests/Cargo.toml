[package]
name = "analux-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
svm-tests = []

[dependencies]
analux = { path = "../programs/analux", features = ["no-entrypoint"] }
anchor-lang.workspace = true
anchor-spl.workspace = true
solana-falcon512.workspace = true
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3.5"
ed25519-dalek = "2.2.0"
solana-sdk = "=2.3.1"
litesvm = "=0.7.1"
# LiteSVM requires the TryFrom<&[u8]> API absent from 2.2.1.
solana-keypair = "=2.2.3"
bincode = "1.3.3"

[lib]
path = "src/lib.rs"
